<div class="admin-shell">
  <!-- Encabezado Principal (Rojo Carmesí) -->
  <header class="admin-header">
    <div class="header-brand">
      <div class="brand-icon-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
          <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
          <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
          <path d="M10 6h4"></path>
          <path d="M10 10h4"></path>
          <path d="M10 14h4"></path>
          <path d="M10 18h4"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="platform-title">PDH - ORURO</h1>
        <p class="platform-subtitle">Plataforma Departamental Hotelera Oruro</p>
      </div>
    </div>

    <div class="header-user-actions">
      <div class="user-pill" title="Usuario autenticado">
        <span class="user-email">{{ userEmail() }}</span>
        <span class="user-role-badge">({{ userRoleLabel() }})</span>
      </div>
      <button type="button" class="logout-btn" (click)="onLogout()" title="Cerrar Sesión">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <!-- Cinta de Opciones (Menú de Navegación Administrador) -->
  <nav class="options-ribbon" aria-label="Menú principal de administración">
    <div class="ribbon-links">
      <a routerLink="inicio" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Inicio</span>
      </a>

      <a routerLink="estadisticas" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Estadísticas</span>
      </a>

      <a routerLink="cumplimiento" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <path d="m9 14 2 2 4-4"></path>
        </svg>
        <span>Reporte de Cumplimiento</span>
      </a>

      <a routerLink="establecimientos" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" y1="8" x2="19" y2="14"></line>
          <line x1="22" y1="11" x2="16" y2="11"></line>
        </svg>
        <span>Registro de Establecimientos</span>
      </a>
    </div>

    <!-- Indicador de Período Activo -->
    <div class="period-indicator">
      <span class="period-label">Período Activo:</span>
      <strong class="period-value">{{ activePeriod() }}</strong>
    </div>
  </nav>

  <!-- Área de Contenido Principal -->
  <main class="admin-content-viewport">
    <router-outlet />
  </main>
</div>
