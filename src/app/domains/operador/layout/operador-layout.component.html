<div class="operador-shell">
  <!-- Encabezado Principal (Rojo Carmesí Institucional) -->
  <header class="operador-header">
    <div class="header-brand">
      <div class="brand-icon-badge">
        <img src="/images/logo_culturas.jpg" alt="Logo de Culturas Oruro" class="brand-logo-img" />
      </div>
      <div class="brand-text">
        <h1 class="platform-title">PDH - ORURO</h1>
        <p class="platform-subtitle">Plataforma Departamental Hotelera Oruro</p>
      </div>
    </div>

    <div class="header-user-actions">
      <div class="user-pill" title="Usuario autenticado">
        <span class="user-email">{{ userEmail() }}</span>
        <span class="user-role-badge">({{ userRoleLabel() }})</span>
      </div>
      <button type="button" class="logout-btn" (click)="onLogout()" title="Cerrar Sesión">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <!-- Cinta de Opciones (Menú de Navegación Operadores / Dependientes) -->
  <nav class="options-ribbon" aria-label="Menú principal del establecimiento">
    <div class="ribbon-links">
      <!-- 1. Mi Información (Establecimiento) -->
      <a routerLink="mi-informacion" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"></path>
          <path d="M5 21V7l8-4v18"></path>
          <path d="M19 21V11l-6-4"></path>
          <path d="M9 9h1"></path>
          <path d="M9 13h1"></path>
          <path d="M9 17h1"></path>
        </svg>
        <span>Mi Información (Establecimiento)</span>
      </a>

      <!-- 2. Mis Formularios -->
      <a routerLink="mis-formularios" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Mis Formularios</span>
      </a>

      <!-- 3. Formulario 1: Estadísticas Hoteleras -->
      <a routerLink="formulario-1" routerLinkActive="active" class="ribbon-item">
        <svg class="ribbon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <line x1="8" y1="14" x2="16" y2="14"></line>
        </svg>
        <span>Formulario 1: Estadísticas Hoteleras</span>
      </a>
    </div>

    <!-- Indicador de Período Activo (Dinámico según calendario del sistema) -->
    <div class="period-indicator">
      <span class="period-label">Período Activo:</span>
      <strong class="period-value">{{ activePeriod() }}</strong>
    </div>
  </nav>

  <!-- Área de Contenido Principal -->
  <main class="operador-content-viewport">
    <router-outlet />
  </main>
</div>
